<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDPs STRENGTH & CONDITIONING - Mobile App</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --color-black: #0a0e14;
      --color-charcoal: #1a1f2e;
      --color-dark: #2d3748;
      --color-silver: #e8eef5;
      --color-blue: #00d4ff;
      --color-blue-dark: #0088cc;
      --color-gold: #d4af37;
      --text-primary: #f5f7fa;
      --text-secondary: #c4cfe0;
      --text-muted: #8b95a8;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0e14 0%, #1a1f2e 50%, #0f1318 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-logo {
      width: 360px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.4));
    }

    h1 {
      font-size: 28px;
      margin: 0 0 8px 0;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--color-silver) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin: 0;
    }

    .form-card {
      background: linear-gradient(135deg, rgba(26, 31, 46, 0.7) 0%, rgba(20, 23, 32, 0.9) 100%);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(45, 55, 72, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus {
      outline: none;
      background: rgba(45, 55, 72, 0.6);
      border-color: rgba(0, 212, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }

    input::placeholder {
      color: var(--text-muted);
    }

    button {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--color-blue) 0%, var(--color-blue-dark) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 212, 255, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .toggle-link {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .toggle-link a {
      color: var(--color-blue);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-link a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .message {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }

    .error {
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.3);
      color: #ff6b6b;
    }

    .success {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      color: var(--color-blue);
    }

    .info-box {
      background: rgba(45, 55, 72, 0.4);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img
        src="/assets/branding/logo.png?v=20260528"
        onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22900%22 height=%22180%22 viewBox=%220 0 900 180%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 rx=%2220%22 fill=%22%230f172a%22/%3E%3Ctext x=%2250%25%22 y=%2254%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22Arial,sans-serif%22 font-size=%2252%22 font-weight=%22700%22 fill=%22%23d4af37%22%3ERDPs STRENGTH %26 CONDITIONING%3C/text%3E%3C/svg%3E';"
        alt="RDPs STRENGTH & CONDITIONING"
        class="brand-logo"
      />
      <h1>RDPs 💪</h1>
      <p class="subtitle">Strength & Conditioning</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="form-card">
      <div id="loginMessage" class="message hidden"></div>

      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input 
          type="email" 
          id="loginEmail" 
          placeholder="Enter your email"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input 
          type="password" 
          id="loginPassword" 
          placeholder="Enter your password"
          autocomplete="current-password"
        >
      </div>

      <button onclick="handleLogin()">Sign In</button>

      <div class="divider">— or —</div>

      <p class="toggle-link">
        No account? <a onclick="toggleForms()">Create one</a>
      </p>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="form-card hidden">
      <div id="registerMessage" class="message hidden"></div>

      <div class="info-box">
        📱 Create an account to save and track your workouts from the kiosk.
      </div>

      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input 
          type="email" 
          id="registerEmail" 
          placeholder="your@email.com"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input 
          type="password" 
          id="registerPassword" 
          placeholder="Create a password"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="registerPassword2">Confirm Password</label>
        <input 
          type="password" 
          id="registerPassword2" 
          placeholder="Confirm password"
          autocomplete="new-password"
        >
      </div>

      <button onclick="handleRegister()">Create Account</button>

      <div class="divider">— or —</div>

      <p class="toggle-link">
        Already have an account? <a onclick="toggleForms()">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    function toggleForms() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('registerForm').classList.toggle('hidden');
    }

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const messageEl = document.getElementById('loginMessage');

      if (!email || !password) {
        showMessage(messageEl, 'Email and password required', 'error');
        return;
      }

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!response.ok) {
          showMessage(messageEl, result.error || 'Login failed', 'error');
          return;
        }

        // Save session
        localStorage.setItem('sessionId', result.sessionId);
        localStorage.setItem('userId', result.userId);
        localStorage.setItem('email', result.email);

        showMessage(messageEl, 'Login successful! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1500);
      } catch (error) {
        showMessage(messageEl, error.message, 'error');
      }
    }

    async function handleRegister() {
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const password2 = document.getElementById('registerPassword2').value;
      const messageEl = document.getElementById('registerMessage');

      if (!email || !password || !password2) {
        showMessage(messageEl, 'All fields required', 'error');
        return;
      }

      if (password !== password2) {
        showMessage(messageEl, 'Passwords do not match', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage(messageEl, 'Password must be at least 6 characters', 'error');
        return;
      }

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const result = await response.json();

        if (!response.ok) {
          showMessage(messageEl, result.error || 'Registration failed', 'error');
          return;
        }

        // Save session
        localStorage.setItem('sessionId', result.sessionId);
        localStorage.setItem('userId', result.userId);
        localStorage.setItem('email', result.email);

        showMessage(messageEl, 'Account created! Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 1500);
      } catch (error) {
        showMessage(messageEl, error.message, 'error');
      }
    }

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = `message ${type}`;
      element.classList.remove('hidden');
    }

    // Check if already logged in
    const sessionId = localStorage.getItem('sessionId');
    if (sessionId) {
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
