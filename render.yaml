services:
  - type: web
    name: gymkiosk-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm run server
    autoDeploy: true
    domains:
      - app.rdpsplace.me
    disk:
      name: gymkiosk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GYMKIOSK_DATA_DIR
        value: /var/data/gymkiosk
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production
      - key: GYMKIOSK_TRUST_PROXY_HOPS
        value: "1"
